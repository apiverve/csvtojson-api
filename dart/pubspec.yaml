name: apiverve_csvtojson
description: "CSV to JSON Converter parses raw CSV text into an array of JSON objects with column names and row counts. It handles comma, semicolon, tab, or pipe delimiters, with optional header row detection."
version: 1.2.3
homepage: https://apiverve.com/marketplace/csvtojson?utm_source=dart&utm_medium=referral&utm_content=homepage
repository: https://github.com/apiverve/csvtojson-api/tree/main/dart

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  http: ^1.1.0
  http_parser: ^4.0.0

dev_dependencies:
  lints: ^3.0.0
  test: ^1.24.0
